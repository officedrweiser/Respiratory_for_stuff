      if (p.s !== it.s || p.e !== it.e) was.push(dShort(p.s) + " " + hm(p.s) + "–" + hm(p.e));
      if ((p.loc || "") !== (it.loc || "")) was.push(p.loc || "kein Raum");
      if (was.length) h += '<div class="kv">' + ICON.alert + "<div><b>Geändert</b> – vorher: " + esc(was.join(", ")) + "</div></div>";
    }
    if (it.loc) h += '<div class="kv">' + ICON.pin + "<div>" + esc(it.loc) + '<br><a href="' + mapsUrl(it.loc) + '" target="_blank" rel="noopener">Auf der Karte zeigen</a></div></div>';
    if (it.who) h += '<div class="kv">' + ICON.person + "<div>" + esc(it.who) + "</div></div>";
    if (it.desc) h += '<div class="kv">' + ICON.text + "<div>" + esc(it.desc) + "</div></div>";
    if (it.url) h += '<div class="kv">' + ICON.link + '<div><a href="' + esc(it.url) + '" target="_blank" rel="noopener">Im Uni-System öffnen</a></div></div>';
    if (it.src === "feed") {
      h += '<label class="f">Meine Notiz<textarea class="in" id="note-in" placeholder="z. B. Skript Kapitel 3 mitnehmen">' + esc(it.note) + "</textarea></label>";
      h += '<div class="acts"><button class="btn" data-act="hide-one" data-id="' + esc(it.id) + '">Termin ausblenden</button><button class="btn" data-act="hide-course" data-k="' + esc(it.k) + '">Ganzen Kurs ausblenden</button><span class="sp"></span><button class="btn primary" data-act="note-save" data-id="' + esc(it.id) + '">Fertig</button></div>';
    } else if (it.src === "own") {
      if (it.note) h += '<div class="kv">' + ICON.text + "<div>" + esc(it.note) + "</div></div>";
      h += '<div class="acts"><button class="btn danger" data-act="own-del" data-id="' + esc(it.base) + '">' + ICON.trash + 'Löschen</button><span class="sp"></span><button class="btn" data-act="own-edit" data-id="' + esc(it.base) + '">Bearbeiten</button><button class="btn primary" data-act="close">Fertig</button></div>';
    } else {
      h += '<div class="acts"><button class="btn" data-act="goto" data-tab="tasks">Zu den Aufgaben</button><span class="sp"></span><button class="btn primary" data-act="task-done-close" data-id="' + esc(it.raw.id) + '">' + ICON.check + "Erledigt</button></div>";
    }
  } else if (sheet.type === "edit") {
    const d = sheet.data;
    h += '<h2 id="sheet-title">' + (d.id ? "Termin bearbeiten" : "Neuer Termin") + "</h2>";
    h += '<form id="ev-form" class="section"><label class="f">Titel<input class="in" id="ef-t" required value="' + esc(d.t) + '" placeholder="z. B. Lerngruppe Analysis" autocomplete="off"></label>';
    h += '<div class="frow"><label class="f">Art<select class="in" id="ef-kind">' + Object.entries(KIND_LABEL).map(([v, l]) => '<option value="' + v + '"' + (d.kind === v ? " selected" : "") + ">" + l + "</option>").join("") + "</select></label>";
    h += '<label class="f">Datum<input class="in" type="date" id="ef-date" required value="' + dateKey(d.s) + '"></label></div>';
    h += '<label class="cb"><input type="checkbox" id="ef-ad"' + (d.ad ? " checked" : "") + "> Ganztägig</label>";
    h += '<div class="frow" id="ef-times"' + (d.ad ? " hidden" : "") + '><label class="f">Von<input class="in" type="time" id="ef-from" value="' + hm(d.s) + '"></label><label class="f">Bis<input class="in" type="time" id="ef-to" value="' + hm(d.e) + '"></label></div>';
    h += '<label class="f">Ort<input class="in" id="ef-loc" value="' + esc(d.loc || "") + '" placeholder="z. B. Bibliothek, 2. Stock" autocomplete="off"></label>';
    h += '<div class="frow"><label class="f">Wiederholen<select class="in" id="ef-rep"><option value="none">nie</option><option value="weekly"' + (d.rep === "weekly" ? " selected" : "") + ">jede Woche</option></select></label>";
    h += '<label class="f" id="ef-until-wrap"' + (d.rep === "weekly" ? "" : " hidden") + '>bis einschließlich<input class="in" type="date" id="ef-until" value="' + (d.until ? dateKey(d.until) : dateKey(addDays(d.s, 90))) + '"></label></div>';
    h += '<div class="f">Farbe<div class="inline" style="gap:8px">' + [OWN_COLOR].concat(PALETTE.filter(p => p !== OWN_COLOR)).slice(0, 10).map(p => '<button type="button" class="swatch" style="--c:' + p + (p === (d.color || OWN_COLOR) ? ";box-shadow:0 0 0 2px var(--fg)" : "") + '" aria-label="Farbe ' + p + '" data-act="ef-color" data-c="' + p + '"></button>').join("") + "</div></div>";
    h += '<label class="f">Notizen<textarea class="in" id="ef-notes">' + esc(d.notes || "") + "</textarea></label>";
    h += '<div class="acts"><button type="button" class="btn" data-act="close">Abbrechen</button><span class="sp"></span><button class="btn primary" type="submit">Speichern</button></div></form>';
  }
  h += "</div></div>";
  root.innerHTML = h;
  const first = root.querySelector("#ef-t");
  if (first && !sheet.data.id) setTimeout(() => first.focus(), 30);
}

/* ----- Hinweis-Leiste ----- */
let toastTimer = null;
function toast(msg, action) {
  const root = document.getElementById("toast-root");
  root.innerHTML = '<div class="toast" role="status"><span>' + esc(msg) + "</span>" + (action ? '<button data-act="toast-action">' + esc(action.label) + "</button>" : "") + "</div>";
  root._action = action ? action.run : null;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { root.innerHTML = ""; root._action = null; }, action ? 6000 : 4200);
}

/* =====================================================================
   8. Bedienung
   ===================================================================== */
function saveUi() { lsSet("ui", { tab: ui.tab, view: ui.view }); }
function move(dir) {
  const step = ui.view === "week" ? 7 : ui.view === "list" ? 7 : 1;
  ui.cursor = addDays(ui.cursor, dir * step);
  if (ui.view === "week") ui.cursor = startOfWeek(ui.cursor) === startOfWeek(Date.now()) ? startOfDay(Date.now()) : startOfWeek(ui.cursor);
  render();
}
function leaveDemo() { if (demoActive()) { state.settings.demoOff = true; } }

function newEventDraft(dayMs) {
  const base = startOfDay(dayMs ?? ui.cursor);
  const now = new Date();
  let hour = base === startOfDay(Date.now()) ? Math.min(22, now.getHours() + 1) : 10;
  const s = base + hour * 3600000;
  return { t: "", kind: "termin", s, e: s + 90 * 60000, ad: false, loc: "", rep: "none", until: null, color: OWN_COLOR, notes: "" };
}

function onClick(ev) {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "close-overlay" && ev.target !== el) return;
  switch (act) {
    case "goto": ui.tab = el.dataset.tab; closeSheet(); saveUi(); render(); break;
    case "today": ui.cursor = startOfDay(Date.now()); render(); break;
    case "prev": move(-1); break;
    case "next": move(1); break;
    case "view": ui.view = el.dataset.v; saveUi(); render(); break;
    case "pick": ui.cursor = +el.dataset.d; render(); break;
    case "pick-day": ui.cursor = +el.dataset.d; ui.view = "day"; saveUi(); render(); break;
    case "demo-off": state.settings.demoOff = true; Store.save("meta"); render(); break;
    case "stale-hide": ui.staleHidden = true; render(); break;
    case "open": openSheet({ type: "event", id: el.dataset.id }); break;
    case "close": case "close-overlay": closeSheet(); break;
    case "new-event": openSheet({ type: "edit", data: newEventDraft() }); break;
    case "note-save": {
      const v = (document.getElementById("note-in") || {}).value || "";
      const id = el.dataset.id;
      if (v.trim()) state.notes[id] = v.trim(); else delete state.notes[id];
      if (!demoActive()) Store.save("meta");
      closeSheet(); render(); break;
    }
    case "hide-one": {
      const id = el.dataset.id;
      state.hidden[id] = 1; Store.save("meta"); closeSheet(); render();
      toast("Termin ausgeblendet.", { label: "Rückgängig", run: () => { delete state.hidden[id]; Store.save("meta"); render(); } });
      break;
    }
    case "hide-course": {
      const k = el.dataset.k;
      state.courses[k] = Object.assign({}, state.courses[k], { hidden: true }); Store.save("meta"); closeSheet(); render();
      toast("Kurs ausgeblendet. Unter „Kurse“ wieder einschalten.", { label: "Rückgängig", run: () => { state.courses[k].hidden = false; Store.save("meta"); render(); } });
      break;
    }
    case "own-edit": {
      const o = state.own.find(x => x.id === el.dataset.id);
      if (o) openSheet({ type: "edit", data: Object.assign({}, o) });
      break;
    }
    case "own-del": {
      const idx = state.own.findIndex(x => x.id === el.dataset.id);
      if (idx < 0) break;
      const [removed] = state.own.splice(idx, 1);
      Store.save("meta"); closeSheet(); render();
      toast("Termin gelöscht.", { label: "Rückgängig", run: () => { state.own.splice(idx, 0, removed); Store.save("meta"); render(); } });
      break;
    }
    case "ef-color": {
      sheet.data.color = el.dataset.c;
      for (const b of document.querySelectorAll('[data-act="ef-color"]')) b.style.boxShadow = b.dataset.c === el.dataset.c ? "0 0 0 2px var(--fg)" : "";
      break;
    }
    case "task-toggle": case "task-done-close": {
      if (demoActive()) { toast("Das ist eine Beispiel-Aufgabe. Leg oben eine eigene an."); break; }
      const t = state.tasks.find(x => x.id === el.dataset.id);
      if (!t) break;
      t.done = act === "task-done-close" ? 1 : (t.done ? 0 : 1);
      t.doneAt = t.done ? Date.now() : 0;
      Store.save("meta");
      if (act === "task-done-close") closeSheet();
      render(); break;
    }
    case "task-del": {
      if (demoActive()) { toast("Das ist eine Beispiel-Aufgabe."); break; }
      const idx = state.tasks.findIndex(x => x.id === el.dataset.id);
      if (idx < 0) break;
      const [removed] = state.tasks.splice(idx, 1);
      Store.save("meta"); render();
      toast("Aufgabe gelöscht.", { label: "Rückgängig", run: () => { state.tasks.splice(idx, 0, removed); Store.save("meta"); render(); } });
      break;
    }
    case "course-color": ui.openCourse = ui.openCourse === el.dataset.k ? null : el.dataset.k; render(); break;
    case "course-setcolor": state.courses[el.dataset.k] = Object.assign({}, state.courses[el.dataset.k], { color: el.dataset.c }); ui.openCourse = null; if (!demoActive()) Store.save("meta"); render(); break;
    case "course-toggle": { const k = el.dataset.k; const c = Object.assign({}, state.courses[k]); c.hidden = !c.hidden; state.courses[k] = c; if (!demoActive()) Store.save("meta"); render(); break; }
    case "unhide-all": state.hidden = {}; Store.save("meta"); render(); toast("Alle Termine sind wieder sichtbar."); break;
    case "sync": { const src = state.sources.find(s => s.id === el.dataset.id); if (src) syncSource(src, false); break; }
    case "gh-sync": ghSync(false); break;
    case "gh-gen": gh.newPass = genPassphrase(); render(); break;
    case "gh-passform": ui.ghPassForm = !ui.ghPassForm; render(); break;
    case "gh-copy": {
      const txt = gh.newPass;
      const fallback = () => { const c = document.getElementById("gh-newpass"); if (c) { const r = document.createRange(); r.selectNodeContents(c); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } toast("Markiert. Jetzt kopieren."); };
      try { navigator.clipboard.writeText(txt).then(() => toast("Passwort kopiert."), fallback); } catch (e) { fallback(); }
      break;
    }
    case "src-del": {
      const idx = state.sources.findIndex(s => s.id === el.dataset.id);
      if (idx < 0) break;
      const [src] = state.sources.splice(idx, 1);
      const evs = state.events[src.id];
      delete state.events[src.id];
      const pass = src.kind === "gh" ? lsGet("ghpass") : null;
      if (src.kind === "gh") { lsDel("ghpass"); if (gh.status === "ok") gh.status = "needpass"; }
      Store.remove("src." + src.id); Store.save("meta"); render();
      toast("„" + (src.name || "Kalender") + "“ entfernt.", { label: "Rückgängig", run: () => { state.sources.splice(idx, 0, src); state.events[src.id] = evs; if (pass) { lsSet("ghpass", pass); gh.status = "ok"; } Store.save("src." + src.id); Store.save("meta"); render(); } });
      break;
    }
    case "backup": exportBackup(); break;
    case "export-ics": exportIcs(); break;
    case "proxy-save": state.settings.proxy = (document.getElementById("proxy-in").value || "").trim(); Store.save("meta"); toast(state.settings.proxy ? "Proxy gespeichert." : "Proxy entfernt."); break;
    case "wipe": ui.confirmWipe = true; render(); break;
    case "wipe-no": ui.confirmWipe = false; render(); break;
    case "wipe-yes": {
      for (const src of state.sources) Store.remove("src." + src.id);
      state = freshState(); state.settings.demoOff = true;
      lsDel("ghpass"); ghKey = null;
      if (gh.status === "ok" || gh.status === "badpass") gh.status = "needpass";
      Store.save("meta"); ui.confirmWipe = false; render(); toast("Alle Daten gelöscht.");
      break;
    }
    case "toast-action": { const root = document.getElementById("toast-root"); const fn = root._action; root.innerHTML = ""; root._action = null; if (fn) fn(); break; }
  }
}

function onSubmit(ev) {
  const f = ev.target;
  if (f.id === "ev-form") {
    ev.preventDefault();
    const d = sheet.data;
    const t = document.getElementById("ef-t").value.trim();
    if (!t) return;
    const day = fromKey(document.getElementById("ef-date").value || dateKey(d.s));
    const ad = document.getElementById("ef-ad").checked;
    let s, e;
    if (ad) { s = day; e = addDays(day, 1); }
    else {
      const [fh, fm] = (document.getElementById("ef-from").value || "10:00").split(":").map(Number);
      const [th, tm] = (document.getElementById("ef-to").value || "11:00").split(":").map(Number);
      const sd = new Date(day); sd.setHours(fh, fm, 0, 0); s = sd.getTime();
      const ed = new Date(day); ed.setHours(th, tm, 0, 0); e = ed.getTime();
      if (e <= s) e = s + 60 * 60000;
    }
    const rep = document.getElementById("ef-rep").value;
    const untilV = document.getElementById("ef-until").value;
    const rec = Object.assign({}, d, {
      t, s, e, ad, kind: document.getElementById("ef-kind").value, loc: document.getElementById("ef-loc").value.trim(),
      rep, until: rep === "weekly" && untilV ? fromKey(untilV) + DAY - 1 : null, notes: document.getElementById("ef-notes").value.trim(), color: d.color || OWN_COLOR
    });
    leaveDemo();
    if (rec.id) { const i = state.own.findIndex(x => x.id === rec.id); if (i >= 0) state.own[i] = rec; else state.own.push(rec); }
    else { rec.id = uid(); state.own.push(rec); }
    Store.save("meta");
    ui.cursor = startOfDay(s);
    closeSheet(); render();
    toast("Termin gespeichert.");
  } else if (f.id === "task-form") {
    ev.preventDefault();
    const t = document.getElementById("tf-title").value.trim();
    if (!t) return;
    leaveDemo();
    state.tasks.push({ id: uid(), t, due: document.getElementById("tf-due").value || null, k: document.getElementById("tf-course").value || null, done: 0 });
    Store.save("meta");
    render();
    setTimeout(() => { const i = document.getElementById("tf-title"); if (i) i.focus(); }, 0);
  } else if (f.id === "gh-form") {
    ev.preventDefault();
    const pass = (document.getElementById("gh-pass").value || "").trim();
    if (pass) ghSync(false, pass);
  } else if (f.id === "src-form") {
    ev.preventDefault();
    const url = document.getElementById("sf-url").value.trim();
    if (!url) return;
    const name = document.getElementById("sf-name").value.trim();
    const src = { id: uid(), name: name || "Stundenplan", autoName: !name, url, kind: "url", lastSync: 0, count: 0 };
    leaveDemo();
    state.sources.push(src);
    Store.save("meta");
    f.reset();
    syncSource(src, false);
  }
}

function onChange(ev) {
  const el = ev.target;
  if (el.id === "jump" && el.value) { ui.cursor = fromKey(el.value); render(); return; }
  if (el.id === "file-in") { leaveDemo(); importFiles(el.files); el.value = ""; return; }
  if (el.dataset && el.dataset.reimport) { importFiles(el.files, el.dataset.reimport); el.value = ""; return; }
  if (el.id === "backup-in" && el.files[0]) { const rd = new FileReader(); rd.onload = () => importBackup(String(rd.result)); rd.readAsText(el.files[0]); el.value = ""; return; }
  if (el.dataset && el.dataset.set) {
    const key = el.dataset.set;
    state.settings[key] = key === "weekend" ? el.value : +el.value;
    Store.save("meta"); render(); return;
  }
  if (el.id === "ef-ad") { document.getElementById("ef-times").hidden = el.checked; return; }
  if (el.id === "ef-rep") { document.getElementById("ef-until-wrap").hidden = el.value !== "weekly"; return; }
}

document.addEventListener("click", onClick);
document.addEventListener("click", ev => { if (ev.target.id === "jump" && ev.target.showPicker) { try { ev.target.showPicker(); } catch (e) { /* Browser öffnet selbst */ } } });
document.addEventListener("submit", onSubmit);
document.addEventListener("change", onChange);
document.getElementById("tabs").addEventListener("click", ev => {
  const b = ev.target.closest(".tab");
  if (!b) return;
  ui.tab = b.dataset.tab; ui.openCourse = null; ui.confirmWipe = false; saveUi(); render();
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && sheet) { closeSheet(); return; }
  if (sheet || ui.tab !== "cal" || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test((ev.target.tagName || ""))) return;
  if (ev.key === "ArrowLeft") move(-1);
  else if (ev.key === "ArrowRight") move(1);
  else if (ev.key === "t" || ev.key === "h") { ui.cursor = startOfDay(Date.now()); render(); }
  else if (ev.key === "d") { ui.view = "day"; saveUi(); render(); }
  else if (ev.key === "w") { ui.view = "week"; saveUi(); render(); }
  else if (ev.key === "l") { ui.view = "list"; saveUi(); render(); }
});

/* Wischen am Telefon: links/rechts blättert */
let touch = null;
document.addEventListener("touchstart", ev => {
  if (ui.tab !== "cal" || sheet || !ev.target.closest(".scroller, .strip")) { touch = null; return; }
  const t = ev.touches[0]; touch = { x: t.clientX, y: t.clientY, at: Date.now() };
}, { passive: true });
document.addEventListener("touchend", ev => {
  if (!touch) return;
  const t = ev.changedTouches[0];
  const dx = t.clientX - touch.x, dy = t.clientY - touch.y;
  if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy) && Date.now() - touch.at < 600) move(dx < 0 ? 1 : -1);
  touch = null;
}, { passive: true });

/* Datei per Drag & Drop */
document.addEventListener("dragover", ev => { const d = ev.target.closest && ev.target.closest("#drop"); if (d) { ev.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", ev => { const d = ev.target.closest && ev.target.closest("#drop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", ev => {
  const d = ev.target.closest && ev.target.closest("#drop");
  if (!d) return;
  ev.preventDefault(); d.classList.remove("over");
  leaveDemo();
  importFiles(ev.dataTransfer.files);
});

function afterLoad() {
  const cutoff = Date.now() - 10 * DAY;
  for (const id in state.changes) if ((state.changes[id].at || 0) < cutoff) delete state.changes[id];
}

/* Jede Minute: Jetzt-Linie und „Als Nächstes" aktualisieren */
let lastDay = startOfDay(Date.now());
setInterval(() => {
  if (sheet || document.hidden) return;
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  if (startOfDay(Date.now()) !== lastDay) { lastDay = startOfDay(Date.now()); }
  if (ui.tab === "cal") render({ soft: true });
}, 60000);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  Store.refreshFromCloud();
  autoSync();
  if (!sheet) render({ soft: true });
});

/* Als App installierbar machen (nur in der eigenständigen Version) */
if (!inArtifact && /^https?:$/.test(location.protocol) && window.top === window.self) {
  const l = document.createElement("link"); l.rel = "manifest"; l.href = "manifest.webmanifest"; document.head.appendChild(l);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}

afterLoad();
render();
autoSync();
Store.connect();
</script>
